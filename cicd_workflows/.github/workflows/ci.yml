name: Auth and Data Services CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_workflows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-auth-secret
    defaults:
      run:
        working-directory: cicd_workflows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_workflows
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t auth-service:${{ github.sha }} .
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag image for registry
        run: docker tag auth-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/auth-service:${{ github.sha }}
      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/auth-service:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deployment
        run: echo "Deploying ghcr.io/${{ github.repository_owner }}/auth-service:${{ github.sha }}"

  lint-data-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_workflows/data-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check .

  test-data-service:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-data-secret
    defaults:
      run:
        working-directory: cicd_workflows/data-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing

  build-data-service:
    needs: [lint-data-service, test-data-service]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_workflows/data-service
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t data-service:${{ github.sha }} .
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag image for registry
        run: docker tag data-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/data-service:${{ github.sha }}
      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/data-service:${{ github.sha }}

  deploy-data-service:
    needs: build-data-service
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deployment
        run: echo "Deploying ghcr.io/${{ github.repository_owner }}/data-service:${{ github.sha }}"
